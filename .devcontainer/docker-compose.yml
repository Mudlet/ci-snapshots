version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../:/workspace:cached
    ports:
      - "8080:80"
    environment:
      - APACHE_DOCUMENT_ROOT=/workspace
      - PHP_MEMORY_LIMIT=256M
      - PHP_UPLOAD_MAX_FILESIZE=256M
      - PHP_POST_MAX_SIZE=256M
    depends_on:
      - db
    networks:
      - devnet

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: ci_snapshots
      MYSQL_USER: snapshots
      MYSQL_PASSWORD: snapshots123
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - devnet

volumes:
  mysql-data:

networks:
  devnet:
